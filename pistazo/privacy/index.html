es: { name: 'Español', title: 'Política de privacidad de Pistazo', meta: 'Desarrollador: JMPartnerChile · Vigente desde el 1 de noviembre de 2026',
  s: [
   ['1. Quiénes somos', 'Pistazo es un juego de JMPartnerChile (Nova Games). Esta política explica qué datos se tratan cuando usas la app.'],

en: { name: 'English', title: 'Pistazo Privacy Policy', meta: 'Developer: JMPartnerChile · Effective November 1, 2026',

   ['7. Changes', 'If we change this policy, we will post the new version on this page with its effective date.'],
   ['8. Contact', 'Questions? Write to <a href="mailto:jmpartnerchile@gmail.com">jmpartnerchile@gmail.com</a>.'] ] },

const nav = document.getElementById('langs'), doc = document.getElementById('doc');
function show(code) {
  const d = L[code] || L.en;
  document.documentElement.lang = code;
  document.title = 'Pistazo — ' + d.title;
  doc.innerHTML = '<h1>' + d.title + '</h1><p class="meta">' + d.meta + '</p>' + d.s.map(([h, p]) => '<h2>' + h + '</h2><p>' + p + '</p>').join('');
  nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === code)));
  history.replaceState(null, '', '#' + code);
}
for (const [code, d] of Object.entries(L)) {
  const b = document.createElement('button');
  b.textContent = d.name; b.dataset.l = code; b.onclick = () => show(code);
  nav.appendChild(b);
}
const wanted = location.hash.slice(1) || (navigator.language || 'es').slice(0, 2);
show(L[wanted] ? wanted : 'es');
</script>
